plugins { id 'com.android.application' }
android {
    namespace 'com.meglodivna.ashsignal'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.meglodivna.ashsignal'
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName '0.5.0-runeheart'
    }
    signingConfigs {
        debug {
            if (System.getenv('ASH_SIGNAL_DEBUG_KEYSTORE')) {
                storeFile file(System.getenv('ASH_SIGNAL_DEBUG_KEYSTORE'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.activity:activity:1.11.0'
}
