name: Soulforge Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Dependencies and simulation tests
        run: npm ci && npm test
      - name: Full campaign validation
        run: npm run test:game
      - name: Build offline game
        run: npm run build && node scripts/sync-android.mjs
      - name: Build and lint debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ASH-SIGNAL-Soulforge-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Soulforge-test-evidence
          path: |
            artifacts/*report.json
            android/app/build/reports/lint-results-debug.html
