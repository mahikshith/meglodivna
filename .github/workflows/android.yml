name: Fractured Realms Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore persistent test signing key
        env:
          ASH_SIGNAL_DEBUG_KEYSTORE_BASE64: ${{ secrets.ASH_SIGNAL_DEBUG_KEYSTORE_BASE64 }}
          ASH_SIGNAL_DEBUG_KEYSTORE: ${{ runner.temp }}/ash-signal-debug.keystore
        run: |
          test -n "$ASH_SIGNAL_DEBUG_KEYSTORE_BASE64"
          printf '%s' "$ASH_SIGNAL_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$ASH_SIGNAL_DEBUG_KEYSTORE"
          keytool -list -keystore "$ASH_SIGNAL_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey
          echo "ASH_SIGNAL_DEBUG_KEYSTORE=$ASH_SIGNAL_DEBUG_KEYSTORE" >> "$GITHUB_ENV"
      - name: Dependencies and simulation tests
        run: npm ci && npm test
      - name: Full campaign validation
        run: |
          node scripts/combat-route.mjs ember
          node scripts/combat-route.mjs forge
          node scripts/combat-route.mjs inferno
          node scripts/combat-route.mjs extinction
          node scripts/combat-route.mjs forge tide
          node scripts/combat-route.mjs forge pyre
          node scripts/combat-route.mjs forge neon
          node scripts/combat-route.mjs forge veil
      - name: Build offline game
        run: npm run build && node scripts/sync-android.mjs
      - name: Build and lint debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ASH-SIGNAL-Fractured-Realms-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Fractured-Realms-test-evidence
          path: |
            artifacts/*report.json
            android/app/build/reports/lint-results-debug.html
