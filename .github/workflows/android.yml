name: Lantern Android APK
on:
  push:
    branches: [main, Revamp, codex/runeheart-rebuild]
    tags: ['v*-lantern']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: soulforge-ember, report: combat-route-soulforge-ember-report.json, args: 'ember soulforge'}
          - {id: soulforge-forge, report: combat-route-soulforge-forge-report.json, args: 'forge soulforge'}
          - {id: soulforge-inferno, report: combat-route-soulforge-inferno-report.json, args: 'inferno soulforge'}
          - {id: soulforge-extinction, report: combat-route-soulforge-extinction-report.json, args: 'extinction soulforge'}
          - {id: bellbeast-forge, report: bellbeast-route-forge-report.json, args: 'forge soulforge --bellbeast'}
          - {id: tide-forge, report: combat-route-tide-forge-report.json, args: 'forge tide'}
          - {id: pyre-forge, report: combat-route-pyre-forge-report.json, args: 'forge pyre'}
          - {id: neon-forge, report: combat-route-neon-forge-report.json, args: 'forge neon'}
          - {id: veil-forge, report: combat-route-veil-forge-report.json, args: 'forge veil'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Complete campaign through legal inputs
        run: |
          rm -f "artifacts/playtest-correction/${{ matrix.report }}"
          node scripts/combat-route.mjs ${{ matrix.args }} --correction
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-${{ matrix.id }}
          path: |
            artifacts/playtest-correction/${{ matrix.report }}
            artifacts/playtest-correction/drivers/*.mjs
          if-no-files-found: error
  apk:
    needs: campaign
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore persistent test signing key
        env:
          ASH_SIGNAL_DEBUG_KEYSTORE_BASE64: ${{ secrets.ASH_SIGNAL_DEBUG_KEYSTORE_BASE64 }}
          ASH_SIGNAL_DEBUG_KEYSTORE: ${{ runner.temp }}/ash-signal-debug.keystore
        run: |
          test -n "$ASH_SIGNAL_DEBUG_KEYSTORE_BASE64"
          printf '%s' "$ASH_SIGNAL_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$ASH_SIGNAL_DEBUG_KEYSTORE"
          keytool -list -keystore "$ASH_SIGNAL_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey
          echo "ASH_SIGNAL_DEBUG_KEYSTORE=$ASH_SIGNAL_DEBUG_KEYSTORE" >> "$GITHUB_ENV"
      - name: Dependencies and simulation tests
        run: npm ci && npm test
      - name: Build offline game
        run: npm run build && node scripts/sync-android.mjs
      - name: Verify correction evidence against tagged sources and bundle
        run: node scripts/verify-correction-evidence.mjs
      - name: Build and lint debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug lintDebug --no-daemon
      - name: Verify signed APK and embedded game
        run: |
          python scripts/verify-apk.py android/app/build/outputs/apk/debug/app-debug.apk \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            --source-commit "$GITHUB_SHA" \
            --ci-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: ASH-SIGNAL-Runeheart-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Runeheart-test-evidence
          path: |
            artifacts/*report.json
            artifacts/playtest-correction/*report.json
            android/app/build/reports/lint-results-debug.html
  prerelease:
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-lantern')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ASH-SIGNAL-Runeheart-debug-APK
          path: release-apk
      - uses: actions/download-artifact@v4
        with:
          name: Runeheart-test-evidence
          path: release-evidence
      - name: Publish and verify exact test APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-upload downloaded
          cp release-apk/app-debug.apk release-upload/ASH-SIGNAL-Lantern-v0.10.0.apk
          cp release-evidence/artifacts/android-report.json release-upload/android-report.json
          cp artifacts/playtest-correction/validation.json release-upload/validation.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          apk = Path('release-upload/ASH-SIGNAL-Lantern-v0.10.0.apk')
          report = json.loads(Path('release-upload/android-report.json').read_text())
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == report['sha256']
          assert report['version'] == '0.10.0-lantern' and report['versionCode'] == 11
          assert os.environ['RELEASE_TAG'] == 'v' + report['version'], 'Release tag and verified APK version differ'
          Path('release-upload/SHA256SUMS.txt').write_text(report['sha256'] + '  ' + apk.name + '\n')
          PY
          gh release create "$RELEASE_TAG" release-upload/* --verify-tag --prerelease --title "The Last Lantern v0.10.0 - The Lantern Path test build" --notes-file docs/LANTERN-PATH-RELEASE.md
          gh release download "$RELEASE_TAG" --dir downloaded --pattern ASH-SIGNAL-Lantern-v0.10.0.apk
          cmp release-upload/ASH-SIGNAL-Lantern-v0.10.0.apk downloaded/ASH-SIGNAL-Lantern-v0.10.0.apk
          echo "Uploaded APK downloaded again and matched byte for byte." >> "$GITHUB_STEP_SUMMARY"
